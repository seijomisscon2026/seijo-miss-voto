<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>80回特典の表示サンプル | 成城ミスコン2026</title>
  <link rel="stylesheet" href="./styles.css?v=story-20261119-video80-v1">
  <script src="./config.js?v=story-20261119-video80-v1"></script>
</head>
<body>
  <main style="max-width:560px;margin:24px auto;padding:0 16px">
    <p style="color:#fff8ec;text-align:center;font-size:14px;line-height:1.7">表示サンプル<br>実際の投票・特典付与は行いません</p>
    <label for="previewCandidate" style="display:block;color:#fff8ec;font-size:14px">表示するファイナリスト</label>
    <select id="previewCandidate" style="width:100%;min-height:44px;margin:8px 0 16px;padding:8px;font-size:16px;border-radius:6px"></select>
    <article class="book-panel new-reward-panel" style="margin-top:0">
      <p>YOUR STORY · 80 / 82</p>
      <h3>新しい特典を獲得しました</h3>
      <section class="image-reward-unlock video-reward-unlock">
        <p class="image-reward-unlock-chapter">CHAPTER V COMPLETE</p>
        <h4 id="videoTitle"></h4>
        <p class="image-reward-unlock-message">累計80回の投票、ありがとうございます。80回目に選んだファイナリストの動画を獲得しました。その後の投票先が変わっても、この動画は変わりません。</p>
        <div class="video-reward-player">
          <video id="rewardVideo" controls playsinline preload="none">動画を再生できない場合は、下のリンクから開いてください。</video>
        </div>
        <a id="videoLink" class="image-reward-unlock-button" rel="noopener noreferrer">動画を開く・保存する</a>
        <p class="image-reward-unlock-note">再生ボタンで音声付きの動画が流れます。表示できない場合は上のリンクから外部ブラウザで開いてください。後から「獲得した特典」でも視聴できます。保存方法は端末やブラウザにより異なります。</p>
      </section>
    </article>
  </main>
  <script>
    (function () {
      'use strict';
      const config = window.SEIJO_CONFIG;
      const asset = config.rewards.find(reward => reward.key === 'thank_you_video').asset;
      const select = document.getElementById('previewCandidate');
      const video = document.getElementById('rewardVideo');
      const versioned = path => `${path}?v=${encodeURIComponent(config.app.assetVersion)}`;
      config.candidates.forEach(candidate => {
        const option = document.createElement('option');
        option.value = candidate.id;
        option.textContent = `No.${Number(candidate.id)} ${candidate.name}`;
        select.appendChild(option);
      });
      function showCandidate() {
        const candidate = config.candidates.find(item => item.id === select.value);
        video.pause();
        video.src = versioned(asset.byCandidate[candidate.id]);
        video.poster = versioned(asset.postersByCandidate[candidate.id]);
        [video.width, video.height] = asset.dimensionsByCandidate[candidate.id];
        video.setAttribute('aria-label', `${candidate.name}さんの80回投票達成・ありがとう動画`);
        document.getElementById('videoTitle').textContent = `${candidate.name}さんのありがとう動画`;
        document.getElementById('videoLink').href = video.src;
        video.load();
      }
      select.addEventListener('change', showCandidate);
      showCandidate();
    })();
  </script>
</body>
</html>
